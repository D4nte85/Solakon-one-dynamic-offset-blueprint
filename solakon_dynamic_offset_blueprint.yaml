blueprint:
  name: Solakon ONE — Dynamischer Offset (Volatilitäts-Regler)
  description: |
    ### Dynamischer Nullpunkt-Offset / Dynamic Zero-Point Offset
    Berechnet einen selbstanpassenden Offset aus der Netz-Volatilität — pro Zone einzeln konfigurierbar, optional mit negativem Offset (Einspeisung).
    Calculates a self-adjusting offset from grid volatility — individually configurable per zone, optionally with negative offset (feed-in).

    **Erforderliche Helfer / Required helpers:**
    - `sensor.solakon_grid_stddev_60s`
    - `input_number.solakon_offset_zone1` / `_zone2` / `_zone_ac` (mind. einer / at least one)
  source_url: https://github.com/D4nte85/Solakon-one-dynamic-offset-blueprint/blob/main/solakon_dynamic_offset_blueprint.yaml
  domain: automation
  input:

    # ══════════════════════════════════════════════════════════════════════════
    # SENSOR — Statistik-Sensor (Pflicht / Required)
    # ══════════════════════════════════════════════════════════════════════════
    sensor_section:
      name: "🔌 Statistik-Sensor / Statistics Sensor"
      description: >
        Pflichtfeld — muss vor der Blueprint-Einrichtung angelegt werden (siehe README).
        Required field — must be created before setting up the blueprint (see README).
      collapsed: false
      input:

        stddev_sensor:
          name: 📊 Statistik-Sensor (StdDev 60s)
          description: >
            Misst die Standardabweichung des Roh-Netzwerts der letzten 60 s — Spikes inklusive.
            Measures the standard deviation of the raw grid value over 60 s — spikes included.
            Standard / Default: `sensor.solakon_grid_stddev_60s`
          default: sensor.solakon_grid_stddev_60s
          selector:
            entity:
              domain: sensor

    # ══════════════════════════════════════════════════════════════════════════
    # ENTLADESCHUTZ — Sensoren (Optional / Optional)
    # ══════════════════════════════════════════════════════════════════════════
    discharge_section:
      name: "🔋 Entladeschutz-Sensoren / Discharge-Protection Sensors"
      description: >
        Nur nötig, wenn „Entladeschutz“ in Zone 1 aktiviert ist. Verhindert, dass ein
        negativer Offset Batterieenergie ins Netz einspeist, während der Akku entlädt.
        Nur Zone 1 entlädt aktiv — Zone 2 und AC erzwingen im Haupt-Blueprint 0 A Entladestrom.
        Only needed if "Discharge protection" is enabled in Zone 1. Prevents a negative
        offset from feeding battery energy into the grid while the battery is discharging.
        Only Zone 1 actively discharges — Zone 2 and AC force 0 A discharge current in the main blueprint.
      collapsed: true
      input:

        pv_power_sensor:
          name: ☀️ PV-Leistung / PV Power
          description: >
            Aktuelle PV-Gesamterzeugung (W). Vergleich mit der Ausgangsleistung erkennt Überschuss.
            Current total PV generation (W). Compared against output power to detect surplus.
            Standard / Default: `sensor.solakon_one_pv_leistung`
          default: sensor.solakon_one_pv_leistung
          selector:
            entity:
              domain: sensor

        actual_power_sensor:
          name: ⚡ Ausgangsleistung / Output Power
          description: >
            Tatsächliche AC-Ausgangsleistung des Wechselrichters (W). Liegt sie über der
            PV-Leistung, kommt die Differenz aus dem Akku (Entladung).
            Actual AC output power of the inverter (W). If it exceeds PV power, the
            difference comes from the battery (discharging).
            Standard / Default: `sensor.solakon_one_leistung`
          default: sensor.solakon_one_leistung
          selector:
            entity:
              domain: sensor

    # ══════════════════════════════════════════════════════════════════════════
    # ZONE 1
    # ══════════════════════════════════════════════════════════════════════════
    zone1_section:
      name: "🎯 Zone 1"
      description: >
        Offset-Ausgabe für Zone 1. Mindestens eine Zone muss konfiguriert sein.
        Offset output for Zone 1. At least one zone must be configured.
      collapsed: false
      input:

        offset_zone1_helper:
          name: 🎯 Ziel-Helper Zone 1 (Optional)
          description: >
            input_number-Helfer für den Offset-Ausgabewert.
            Bei negativem Offset: min des Helfers auf −500 setzen.
            input_number helper for the offset output value.
            With negative offset: set the helper's min to −500.
            Standard / Default: `input_number.solakon_offset_zone1`
          default: {}
          selector:
            entity:
              domain: input_number

        zone1_negative_offset:
          name: "↕️ Negativer Offset / Negative Offset"
          description: >
            Aus / Ein — Offset wird negativ ausgegeben (Regelziel < 0 W, leichte Einspeisung).
            Off / On — offset output is negative (target < 0 W, slight feed-in).
            Helfer-Min auf −500 setzen! / Set helper min to −500!
          default: false
          selector:
            boolean:

        zone1_min_offset:
          name: "📉 Minimaler Offset / Minimum Offset (W)"
          description: >
            Grundpuffer bei ruhigem Netz (StdDev unter Rausch-Schwelle).
            Base buffer during calm grid conditions (StdDev below noise floor).
            Shelly 3EM: 30–50 W empfohlen / recommended.
          default: 30
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: W

        zone1_cap_offset:
          name: "📈 Maximaler Offset / Maximum Offset (W)"
          description: >
            Obergrenze bei sehr unruhigem Netz. Schützt vor übermäßigem Netzbezug.
            Upper limit during very volatile grid conditions. Prevents excessive grid draw.
            Empfehlung / Recommended: 250 W.
          default: 250
          selector:
            number:
              min: 50
              max: 1000
              unit_of_measurement: W

        zone1_noise_floor:
          name: "🔇 Rausch-Schwelle / Noise Floor (W)"
          description: >
            StdDev unterhalb dieser Schwelle gilt als Messrauschen — keine Offset-Erhöhung.
            StdDev below this threshold is treated as measurement noise — no offset increase.
            Empfehlung / Recommended: 15 W (Shelly 3EM).
          default: 15
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: W

        zone1_volatility_factor:
          name: "📊 Volatilitäts-Faktor / Volatility Factor"
          description: >
            Verstärkung der Netz-Volatilität auf den Offset.
            Amplification of grid volatility on the offset.
            Beispiele / Examples (StdDev=80 W, noise=15 W):
            0.5 → +33 W | 1.5 → +98 W | 3.0 → +195 W
            Empfehlung / Recommended: 1.5.
          default: 1.5
          selector:
            number:
              min: 0.5
              max: 5.0
              step: 0.1

        zone1_discharge_protection:
          name: "🛡️ Entladeschutz / Discharge Protection"
          description: >
            Aus / Ein — nur wirksam bei aktivem negativem Offset. Ein: Einspeisung wird
            unterdrückt (Offset wird positiv), sobald der Akku entlädt (Ausgang ≥ PV).
            Benötigt die Entladeschutz-Sensoren. Die SoC-Zonenlogik übernimmt das Haupt-Blueprint.
            Off / On — only effective with negative offset enabled. On: feed-in is suppressed
            (offset turns positive) as soon as the battery discharges (output ≥ PV).
            Requires the discharge-protection sensors. SoC zone logic is handled by the main blueprint.
          default: false
          selector:
            boolean:

        zone1_discharge_hysteresis:
          name: "↔️ Entlade-Hysterese / Discharge Hysteresis (W)"
          description: >
            Sicherheitsmarge auf den Vergleich PV > Ausgang. PV muss die Ausgangsleistung um
            diesen Wert übersteigen, damit Überschuss als echt gilt — verhindert Vorzeichen-Flattern.
            Safety margin on the PV > output comparison. PV must exceed output power by this
            amount for surplus to count as real — prevents sign chatter.
            Empfehlung / Recommended: 50 W.
          default: 50
          selector:
            number:
              min: 0
              max: 500
              unit_of_measurement: W

    # ══════════════════════════════════════════════════════════════════════════
    # ZONE 2
    # ══════════════════════════════════════════════════════════════════════════
    zone2_section:
      name: "🎯 Zone 2"
      description: >
        Offset-Ausgabe für Zone 2. Mindestens eine Zone muss konfiguriert sein.
        Offset output for Zone 2. At least one zone must be configured.
      collapsed: true
      input:

        offset_zone2_helper:
          name: 🎯 Ziel-Helper Zone 2 (Optional)
          description: >
            input_number-Helfer für den Offset-Ausgabewert.
            Bei negativem Offset: min des Helfers auf −500 setzen.
            input_number helper for the offset output value.
            With negative offset: set the helper's min to −500.
            Standard / Default: `input_number.solakon_offset_zone2`
          default: {}
          selector:
            entity:
              domain: input_number

        zone2_negative_offset:
          name: "↕️ Negativer Offset / Negative Offset"
          description: >
            Aus / Ein — Offset wird negativ ausgegeben (Regelziel < 0 W, leichte Einspeisung).
            Off / On — offset output is negative (target < 0 W, slight feed-in).
            Helfer-Min auf −500 setzen! / Set helper min to −500!
          default: false
          selector:
            boolean:

        zone2_min_offset:
          name: "📉 Minimaler Offset / Minimum Offset (W)"
          description: >
            Grundpuffer bei ruhigem Netz (StdDev unter Rausch-Schwelle).
            Base buffer during calm grid conditions (StdDev below noise floor).
            Shelly 3EM: 30–50 W empfohlen / recommended.
          default: 30
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: W

        zone2_cap_offset:
          name: "📈 Maximaler Offset / Maximum Offset (W)"
          description: >
            Obergrenze bei sehr unruhigem Netz. Schützt vor übermäßigem Netzbezug.
            Upper limit during very volatile grid conditions. Prevents excessive grid draw.
            Empfehlung / Recommended: 250 W.
          default: 250
          selector:
            number:
              min: 50
              max: 1000
              unit_of_measurement: W

        zone2_noise_floor:
          name: "🔇 Rausch-Schwelle / Noise Floor (W)"
          description: >
            StdDev unterhalb dieser Schwelle gilt als Messrauschen — keine Offset-Erhöhung.
            StdDev below this threshold is treated as measurement noise — no offset increase.
            Empfehlung / Recommended: 15 W (Shelly 3EM).
          default: 15
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: W

        zone2_volatility_factor:
          name: "📊 Volatilitäts-Faktor / Volatility Factor"
          description: >
            Verstärkung der Netz-Volatilität auf den Offset.
            Amplification of grid volatility on the offset.
            Empfehlung / Recommended: 1.5.
          default: 1.5
          selector:
            number:
              min: 0.5
              max: 5.0
              step: 0.1

    # ══════════════════════════════════════════════════════════════════════════
    # ZONE AC
    # ══════════════════════════════════════════════════════════════════════════
    zone_ac_section:
      name: "🎯 Zone AC"
      description: >
        Offset-Ausgabe für AC-Laden. Mindestens eine Zone muss konfiguriert sein.
        Offset output for AC charging. At least one zone must be configured.
      collapsed: true
      input:

        offset_zone_ac_helper:
          name: 🎯 Ziel-Helper Zone AC (Optional)
          description: >
            input_number-Helfer für den Offset-Ausgabewert.
            Bei negativem Offset: min des Helfers auf −500 setzen.
            input_number helper for the offset output value.
            With negative offset: set the helper's min to −500.
            Standard / Default: `input_number.solakon_offset_zone_ac`
          default: {}
          selector:
            entity:
              domain: input_number

        zone_ac_negative_offset:
          name: "↕️ Negativer Offset / Negative Offset"
          description: >
            Aus / Ein — Offset wird negativ ausgegeben (Regelziel < 0 W, leichte Einspeisung).
            Off / On — offset output is negative (target < 0 W, slight feed-in).
            Helfer-Min auf −500 setzen! / Set helper min to −500!
          default: false
          selector:
            boolean:

        zone_ac_min_offset:
          name: "📉 Minimaler Offset / Minimum Offset (W)"
          description: >
            Grundpuffer bei ruhigem Netz (StdDev unter Rausch-Schwelle).
            Base buffer during calm grid conditions (StdDev below noise floor).
            Shelly 3EM: 30–50 W empfohlen / recommended.
          default: 30
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: W

        zone_ac_cap_offset:
          name: "📈 Maximaler Offset / Maximum Offset (W)"
          description: >
            Obergrenze bei sehr unruhigem Netz. Schützt vor übermäßigem Netzbezug.
            Upper limit during very volatile grid conditions. Prevents excessive grid draw.
            Empfehlung / Recommended: 250 W.
          default: 250
          selector:
            number:
              min: 50
              max: 1000
              unit_of_measurement: W

        zone_ac_noise_floor:
          name: "🔇 Rausch-Schwelle / Noise Floor (W)"
          description: >
            StdDev unterhalb dieser Schwelle gilt als Messrauschen — keine Offset-Erhöhung.
            StdDev below this threshold is treated as measurement noise — no offset increase.
            Empfehlung / Recommended: 15 W (Shelly 3EM).
          default: 15
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: W

        zone_ac_volatility_factor:
          name: "📊 Volatilitäts-Faktor / Volatility Factor"
          description: >
            Verstärkung der Netz-Volatilität auf den Offset.
            Amplification of grid volatility on the offset.
            Empfehlung / Recommended: 1.5.
          default: 1.5
          selector:
            number:
              min: 0.5
              max: 5.0
              step: 0.1

# Single: Gleichzeitige Ausführungen werden verworfen — kein Datenverlust, da StdDev ein 60s-Mittelwert ist.
# Single: Concurrent executions are discarded — no data loss since StdDev is a 60 s rolling average.
mode: single

variables:
  stddev_sensor: !input stddev_sensor
  # Entladeschutz-Sensoren / Discharge-protection sensors
  pv_power_sensor: !input pv_power_sensor
  actual_power_sensor: !input actual_power_sensor
  # Zone 1
  offset_zone1_entity: !input offset_zone1_helper
  zone1_negative: !input zone1_negative_offset
  zone1_min: !input zone1_min_offset
  zone1_cap: !input zone1_cap_offset
  zone1_noise: !input zone1_noise_floor
  zone1_factor: !input zone1_volatility_factor
  zone1_discharge_protect: !input zone1_discharge_protection
  zone1_hysteresis: !input zone1_discharge_hysteresis
  # Zone 2
  offset_zone2_entity: !input offset_zone2_helper
  zone2_negative: !input zone2_negative_offset
  zone2_min: !input zone2_min_offset
  zone2_cap: !input zone2_cap_offset
  zone2_noise: !input zone2_noise_floor
  zone2_factor: !input zone2_volatility_factor
  # Zone AC
  offset_zone_ac_entity: !input offset_zone_ac_helper
  zone_ac_negative: !input zone_ac_negative_offset
  zone_ac_min: !input zone_ac_min_offset
  zone_ac_cap: !input zone_ac_cap_offset
  zone_ac_noise: !input zone_ac_noise_floor
  zone_ac_factor: !input zone_ac_volatility_factor
  # Entladeschutz-Entscheidung: Einspeisung nur bei echtem PV-Überschuss (PV > Ausgang +
  # Hysterese). Die SoC-Zonenlogik übernimmt bereits das Haupt-Blueprint — hier kein
  # zusätzliches SoC-Gate. Sensor ungültig (-1) → Schutz greift (kein Feed-in).
  # Discharge-protection decision: feed-in only on genuine PV surplus (PV > output +
  # hysteresis). SoC zone logic is already handled by the main blueprint — no extra SoC
  # gate here. Sensor invalid (-1) → protect (no feed-in).
  dp_pv: "{{ states(pv_power_sensor) | float(-1) }}"
  dp_out: "{{ states(actual_power_sensor) | float(-1) }}"
  # Gültigkeit / Validity
  offset_zone1_valid: >
    {{ offset_zone1_entity is string and offset_zone1_entity | length > 0 }}
  offset_zone2_valid: >
    {{ offset_zone2_entity is string and offset_zone2_entity | length > 0 }}
  offset_zone_ac_valid: >
    {{ offset_zone_ac_entity is string and offset_zone_ac_entity | length > 0 }}

triggers:
  # Alle 30 s auswerten — StdDev ist ein 60s-Mittelwert und ändert sich träge.
  # Trigger auf state des stddev_sensor würde bei 1s-Update-Rate des Netzsensors
  # ~86.400×/Tag auslösen und die HA-Datenbank stark belasten.
  # Every 30 s — StdDev is a 60 s rolling average and changes slowly.
  # A state trigger on stddev_sensor would fire ~86,400×/day at 1 s grid-sensor
  # update rate, causing excessive HA database growth.
  - trigger: time_pattern
    seconds: "/30"

actions:
  # ── Offsets berechnen / Calculate offsets ─────────────────────────────────
  # Formel / Formula:
  #   volatility_buffer = max(0, (StdDev − noise_floor) × factor)
  #   offset            = clamp(min_offset + volatility_buffer, min_offset, cap_offset)
  #   Bei negativem Offset / With negative offset: result × −1
  - variables:
      dynamic_offset_zone1: >
        {% set s = states(stddev_sensor) | float(-1) %}
        {% set m = zone1_min | int(30) %}
        {% set c = zone1_cap | int(250) %}
        {% set n = zone1_noise | float(15) %}
        {% set f = zone1_factor | float(1.5) %}
        {% set neg = zone1_negative | bool(false) %}
        {% set dp = zone1_discharge_protect | bool(false) %}
        {% set hy = zone1_hysteresis | float(50) %}
        {% set sensors_ok = dp_pv >= 0 and dp_out >= 0 %}
        {% set feed_ok = sensors_ok and dp_pv > (dp_out + hy) %}
        {% set sign = -1 if (neg and (not dp or feed_ok)) else 1 %}
        {% if s < 0 %}
          {{ m | int * sign }}
        {% else %}
          {% set buf = [0, (s - n) * f] | max %}
          {% set result = [[m, (m + buf) | round(0) | int] | max, c] | min %}
          {{ result | int * sign }}
        {% endif %}

      dynamic_offset_zone2: >
        {% set s = states(stddev_sensor) | float(-1) %}
        {% set m = zone2_min | int(30) %}
        {% set c = zone2_cap | int(250) %}
        {% set n = zone2_noise | float(15) %}
        {% set f = zone2_factor | float(1.5) %}
        {% set neg = zone2_negative | bool(false) %}
        {% if s < 0 %}
          {{ m | int * (-1 if neg else 1) }}
        {% else %}
          {% set buf = [0, (s - n) * f] | max %}
          {% set result = [[m, (m + buf) | round(0) | int] | max, c] | min %}
          {{ result | int * (-1 if neg else 1) }}
        {% endif %}

      dynamic_offset_zone_ac: >
        {% set s = states(stddev_sensor) | float(-1) %}
        {% set m = zone_ac_min | int(30) %}
        {% set c = zone_ac_cap | int(250) %}
        {% set n = zone_ac_noise | float(15) %}
        {% set f = zone_ac_factor | float(1.5) %}
        {% set neg = zone_ac_negative | bool(false) %}
        {% if s < 0 %}
          {{ m | int * (-1 if neg else 1) }}
        {% else %}
          {% set buf = [0, (s - n) * f] | max %}
          {% set result = [[m, (m + buf) | round(0) | int] | max, c] | min %}
          {{ result | int * (-1 if neg else 1) }}
        {% endif %}

  # ── Offset in Zonen schreiben / Write offset to zones ─────────────────────
  # Nur schreiben wenn Zone konfiguriert UND Wert geändert — vermeidet unnötige
  # DB-Einträge wenn StdDev stabil ist und sich der Offset nicht ändert.
  # Only write when zone configured AND value changed — avoids unnecessary
  # DB entries when StdDev is stable and the offset does not change.
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ offset_zone1_valid and
                 (states(offset_zone1_entity) | int(-999)) != (dynamic_offset_zone1 | int) }}
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ offset_zone1_entity }}"
            data:
              value: "{{ dynamic_offset_zone1 }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ offset_zone2_valid and
                 (states(offset_zone2_entity) | int(-999)) != (dynamic_offset_zone2 | int) }}
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ offset_zone2_entity }}"
            data:
              value: "{{ dynamic_offset_zone2 }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ offset_zone_ac_valid and
                 (states(offset_zone_ac_entity) | int(-999)) != (dynamic_offset_zone_ac | int) }}
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ offset_zone_ac_entity }}"
            data:
              value: "{{ dynamic_offset_zone_ac }}"
